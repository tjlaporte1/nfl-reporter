# ─────────────────────────────────────────────────────────────────────────────
# Refresh NFL Daily Data
#
# WHAT THIS FILE IS:
# A GitHub Actions "workflow" — a set of automated instructions that GitHub
# runs on its own servers on a schedule (or when you trigger it manually).
# You don't need to run this yourself. GitHub reads it automatically because
# it lives in the special `.github/workflows/` folder.
#
# WHAT IT DOES:
# 1. Runs daily during Jan, Feb, Sept, Oct, Nov, Dec at 11:00 UTC
# 2. Installs Python + nflreadpy + polars on a temporary GitHub server
# 3. Runs scripts/fetch-daily-data.py to pull latest rosters and injury data
# 4. Saves results to rosters.parquet and injuries.parquet in your repo
# 5. Commits and pushes the files back to the repo automatically
# ─────────────────────────────────────────────────────────────────────────────

name: Refresh NFL Roster & Injury Data

on:
  # ── Scheduled trigger ──────────────────────────────────────────────────────
  # Cron syntax: minute  hour  day-of-month  month  day-of-week
  # "0 11 * 1,2,9,10,11,12 *" = at 11:00 UTC every day in Jan, Feb, Sept, Oct, Nov, Dec
  # UTC 11:00 = ET 7:00 AM (EST) or 6:00 AM (EDT)
  # These months cover the NFL pre-season, regular season, and playoffs.
  schedule:
    - cron: "0 11 * 1,2,9,10,11,12 *"

  # ── Manual trigger ─────────────────────────────────────────────────────────
  # This adds a "Run workflow" button on the GitHub Actions tab in your repo.
  # Useful for: testing the workflow, forcing a mid-season refresh, or re-running
  # after fixing a bug.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-refresh-job:
    # ── Runner ───────────────────────────────────────────────────────────────
    # "ubuntu-latest" = a fresh Linux virtual machine spun up by GitHub.
    # It's wiped and recreated every run — nothing persists between runs
    # except what you explicitly commit to the repo.
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Check out your repo ────────────────────────────────────────
      # This clones your GitHub repo onto the temporary Ubuntu machine so the
      # workflow can read your scripts and write the data files.
      - name: Check out repository
        uses: actions/checkout@v5

      # ── Step 2: Set up Python ──────────────────────────────────────────────
      # Installs Python 3.14 on the Ubuntu machine.
      # actions/setup-python is a pre-built action maintained by GitHub.
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.14"

      # ── Step 3: Install dependencies ───────────────────────────────────────
      # pip install runs on the Ubuntu machine (not in a browser — full pip
      # works here). We install exactly what fetch-daily-data.py needs.
      - name: Install dependencies
        run: |
          pip install nflreadpy polars pyarrow

      # ── Step 4: Run the data fetch script ─────────────────────────────────
      # Executes scripts/fetch-daily-data.py which pulls rosters and injury data
      # and writes rosters.parquet and injuries.parquet to the data/ folder.
      - name: Fetch NFL data
        run: python scripts/fetch-daily-data.py

      # ── Step 5: Commit and push the data files ───────────────────────────────
      # After fetch-daily-data.py writes the parquet files, we need to commit
      # them back to the repo so dashboards and notebooks can read them.
      #
      # git config: sets a name/email for the automated commit. GitHub Actions
      # doesn't have a "real" user, so we use a conventional bot identity.
      #
      # git add: stages the data files (not any accidental other changes).
      #
      # git diff --staged --quiet: checks if there's actually anything new to
      # commit. If nflreadpy returned the same data as last run, we skip the
      # commit to keep history clean.
      #
      # git push: pushes back to the main branch of your repo.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rosters.parquet data/injuries.parquet
          if git diff --staged --quiet; then
            echo "No changes to commit — data unchanged since last run."
          else
            git commit -m "chore: refresh NFL data [$(date -u '+%Y-%m-%d')]"
            git push
          fi