# ─────────────────────────────────────────────────────────────────────────────
# Refresh NFL Weekly Data
#
# WHAT THIS FILE IS:
# A GitHub Actions "workflow" — a set of automated instructions that GitHub
# runs on its own servers on a schedule (or when you trigger it manually).
# You don't need to run this yourself. GitHub reads it automatically because
# it lives in the special `.github/workflows/` folder.
#
# WHAT IT DOES:
# 1. Runs every Sunday, Monday, Tuesday, Friday, and Saturday at 11:00 UTC
# 2. Installs Python + nflreadpy + polars on a temporary GitHub server
# 3. Runs scripts/fetch-weekly-data.py to pull latest NFL team stats, schedules,
#    player stats, and teams data
# 4. Saves results to parquet files (teams, schedules, team-stats, player-stats)
# 5. Commits and pushes the files back to the repo automatically
# ─────────────────────────────────────────────────────────────────────────────

name: Refresh NFL Weekly Team & Player Data

on:
  # ── Scheduled trigger ──────────────────────────────────────────────────────
  # Cron syntax: minute  hour  day-of-month  month  day-of-week
  # "0 11 * * 0,1,2,5,6" = at 11:00 UTC on Sunday, Monday, Tuesday, Friday, Saturday
  # UTC 11:00 = ET 7:00 AM (EST) or 6:00 AM (EDT during season)
  schedule:
    - cron: "0 11 * * 0,1,2,5,6"

  # ── Manual trigger ─────────────────────────────────────────────────────────
  # This adds a "Run workflow" button on the GitHub Actions tab in your repo.
  # Useful for: testing the workflow, forcing a mid-week refresh, or re-running
  # after fixing a bug.
  workflow_dispatch:

# ── Permissions ───────────────────────────────────────────────────────────────
# Allow this workflow to commit and push changes back to the repository.
permissions:
  contents: write

jobs:
  weekly-refresh-job:
    # ── Runner ───────────────────────────────────────────────────────────────
    # "ubuntu-latest" = a fresh Linux virtual machine spun up by GitHub.
    # It's wiped and recreated every run — nothing persists between runs
    # except what you explicitly commit to the repo.
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Check out your repo ────────────────────────────────────────
      # This clones your GitHub repo onto the temporary Ubuntu machine so the
      # workflow can read your scripts and write the data files.
      - name: Check out repository
        uses: actions/checkout@v5

      # ── Step 2: Set up Python ──────────────────────────────────────────────
      # Installs Python 3.14 on the Ubuntu machine.
      # actions/setup-python is a pre-built action maintained by GitHub.
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.14"

      # ── Step 3: Install dependencies ───────────────────────────────────────
      # pip install runs on the Ubuntu machine (not in a browser — full pip
      # works here). We install exactly what fetch-weekly-data.py needs.
      - name: Install dependencies
        run: |
          pip install nflreadpy polars pyarrow

      # ── Step 4: Run the data fetch script ─────────────────────────────────
      # Executes scripts/fetch-weekly-data.py which pulls NFL data and writes
      # teams.parquet, schedules.parquet, team-stats.parquet, player-stats.parquet
      - name: Fetch NFL data
        run: python scripts/fetch-weekly-data.py

      # ── Step 5: Commit and push the data files ───────────────────────────────
      # After fetch-weekly-data.py writes the parquet files, we need to commit
      # them back to the repo so dashboards and notebooks can read them.
      #
      # git config: sets a name/email for the automated commit. GitHub Actions
      # doesn't have a "real" user, so we use a conventional bot identity.
      #
      # git add: stages the data files (not any accidental other changes).
      #
      # git diff --staged --quiet: checks if there's actually anything new to
      # commit. If nflreadpy returned the same data as last run (e.g., bye
      # week or no new games), we skip the commit to keep history clean.
      #
      # git push: pushes back to the main branch of your repo.
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/teams.parquet data/schedules.parquet data/team-stats.parquet data/player-stats.parquet
          if git diff --staged --quiet; then
            echo "No changes to commit — data unchanged since last run."
          else
            git commit -m "chore: refresh NFL weekly data [$(date -u '+%Y-%m-%d')]"
            git push
          fi