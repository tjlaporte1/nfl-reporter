# ─────────────────────────────────────────────────────────────────────────────
# refresh_data.yml — Weekly NFL Data Refresh
#
# WHAT THIS FILE IS:
# A GitHub Actions "workflow" — a set of automated instructions that GitHub
# runs on its own servers on a schedule (or when you trigger it manually).
# You don't need to run this yourself. GitHub reads it automatically because
# it lives in the special `.github/workflows/` folder.
#
# WHAT IT DOES:
# 1. Wakes up every Tuesday at 6 AM ET (after Monday Night Football is final)
# 2. Installs Python + nflreadpy + polars on a temporary GitHub server
# 3. Runs scripts/fetch_data.py to pull the latest 2025 NFL team stats
# 4. Saves the result to data/team_stats_2025.parquet in your repo
# 5. Commits and pushes that file back to the repo automatically
#
# Your Marimo notebook on molab then reads that file via its raw GitHub URL.
# ─────────────────────────────────────────────────────────────────────────────

name: Refresh NFL Data

on:
  # ── Scheduled trigger ──────────────────────────────────────────────────────
  # Cron syntax: minute  hour  day-of-month  month  day-of-week
  # "0 11 * * 2" = at 11:00 UTC every Tuesday
  # UTC 11:00 = ET 7:00 AM (EST) or 6:00 AM (EDT during season)
  # Monday Night Football typically ends by 11:30 PM ET, so Tuesday 6 AM is safe.
  schedule:
    - cron: "0 11 * * 2"

  # ── Manual trigger ─────────────────────────────────────────────────────────
  # This adds a "Run workflow" button on the GitHub Actions tab in your repo.
  # Useful for: testing the workflow for the first time, forcing a refresh
  # mid-week, or re-running after fixing a bug.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    # ── Runner ───────────────────────────────────────────────────────────────
    # "ubuntu-latest" = a fresh Linux virtual machine spun up by GitHub.
    # It's wiped and recreated every run — nothing persists between runs
    # except what you explicitly commit to the repo.
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Check out your repo ────────────────────────────────────────
      # This clones your GitHub repo onto the temporary Ubuntu machine so the
      # workflow can read your scripts and write the data file.
      - name: Check out repository
        uses: actions/checkout@v4

      # ── Step 2: Set up Python ──────────────────────────────────────────────
      # Installs Python 3.14 on the Ubuntu machine.
      # actions/setup-python is a pre-built action maintained by GitHub.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # ── Step 3: Install dependencies ───────────────────────────────────────
      # pip install runs on the Ubuntu machine (not in a browser — full pip
      # works here). We install exactly what fetch_data.py needs.
      - name: Install dependencies
        run: |
          pip install nflreadpy polars pyarrow

      # ── Step 4: Run the data fetch script ─────────────────────────────────
      # Executes scripts/fetch_data.py (we'll create that file next).
      # That script pulls NFL data and writes data/team_stats_2025.parquet.
      - name: Fetch NFL data
        run: python scripts/fetch_data.py

      # ── Step 5: Commit and push the data file ─────────────────────────────
      # After fetch_data.py writes the parquet file, we need to commit it
      # back to the repo so the molab notebook can read it via raw GitHub URL.
      #
      # git config: sets a name/email for the automated commit. GitHub Actions
      # doesn't have a "real" user, so we use a conventional bot identity.
      #
      # git add: stages only the data file (not any accidental other changes).
      #
      # git diff --staged --quiet: checks if there's actually anything new to
      # commit. If nflreadpy returned the same data as last week (e.g., bye
      # week or no new games), we skip the commit to keep history clean.
      #
      # git push: pushes back to the main branch of your repo.
      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/team-stats-curr-season.parquet
          if git diff --staged --quiet; then
            echo "No changes to commit — data unchanged since last run."
          else
            git commit -m "chore: refresh NFL data [$(date -u '+%Y-%m-%d')]"
            git push
          fi